<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body><div class="cursor-glow"></div><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main>
    <h1>Expense Tracker</h1>
    <section class="summary">
      <div><span>Balance</span><strong id="balance">₹0.00</strong></div>
      <div><span>Income</span><strong id="income">₹0.00</strong></div>
      <div><span>Expense</span><strong id="expense">₹0.00</strong></div>
    </section>
    <section class="card">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <input id="description" type="text" placeholder="Description" required>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
        <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
        <select id="category">
          <option>Food</option><option>Transport</option><option>Shopping</option>
          <option>Bills</option><option>Entertainment</option><option>Health</option><option>Other</option>
        </select>
        <button type="submit">Add Transaction</button>
      </form>
    </section>
    <section class="card">
      <div class="toolbar">
        <h2>Transactions</h2>
        <div>
          <select id="filter"><option value="all">All</option><option value="income">Income</option><option value="expense">Expense</option></select>
          <button id="clearAll" type="button">Clear All</button>
          <button id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
        </div>
      </div>
      <div id="transactions"></div>
    </section>
    <section class="card">
      <h2>Spending by Category</h2>
      <div id="categoryBars"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
